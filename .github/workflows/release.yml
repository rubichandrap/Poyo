name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile TypeScript
        run: |
          pnpm --filter @rubichandrap/poyo build
          pnpm --filter @rubichandrap/create-poyo-app build

      - name: Assert package versions match the tag
        run: node scripts/assert-release-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Fail if the tag version is already published
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          for pkg in poyo-template poyo create-poyo-app; do
            if npm view "@rubichandrap/${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "::error::@rubichandrap/${pkg}@${VERSION} already exists on npm; bump the version before tagging."
              exit 1
            fi
          done
          echo "Version ${VERSION} is not yet published on npm."

      - name: Publish poyo-template
        working-directory: packages/poyo-template
        run: pnpm publish --access public --no-git-checks

      - name: Publish poyo
        working-directory: packages/poyo
        run: pnpm publish --access public --no-git-checks

      - name: Publish create-poyo-app
        working-directory: packages/create-poyo-app
        run: pnpm publish --access public --no-git-checks

      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          body=$(awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="Release ${GITHUB_REF_NAME}"
          fi
          printf '%s\n' "$body" > /tmp/release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
